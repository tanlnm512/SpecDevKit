name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skills (py ${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The README's floor and the newest release.
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Define skill suite
        run: skills/spec-define/tests/run.sh
      - name: Design skill suite
        run: skills/spec-design/tests/run.sh
      - name: Build skill suite
        run: skills/spec-build/tests/run.sh
      - name: Review skill suite
        run: skills/spec-review/tests/run.sh
      - name: Discover skill suite
        run: skills/spec-discover/tests/run.sh
      - name: Ship skill suite
        run: skills/spec-ship/tests/run.sh
      - name: Release skill suite
        run: skills/spec-release/tests/run.sh
      - name: Compile Python sources
        run: python3 -m compileall -q skills tools
      - name: Shell syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n
      - name: Generated-artifact drift
        run: python3 tools/drift-check.py

  tooling:
    name: tooling (py ${{ matrix.python }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tooling suite
        run: tools/tests/run.sh
