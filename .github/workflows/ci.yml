name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Define skill suite
        run: skills/spec-define/tests/run.sh
      - name: Design skill suite
        run: skills/spec-design/tests/run.sh
      - name: Build skill suite
        run: skills/spec-build/tests/run.sh
      - name: Review skill suite
        run: skills/spec-review/tests/run.sh
      - name: Discover skill suite
        run: skills/spec-discover/tests/run.sh
      - name: Ship skill suite
        run: skills/spec-ship/tests/run.sh
      - name: Release skill suite
        run: skills/spec-release/tests/run.sh
      - name: Tooling suite
        run: tools/tests/run.sh
      - name: Compile Python sources
        run: python3 -m compileall -q skills tools
      - name: Shell syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n
      - name: Generated-artifact drift
        run: python3 tools/drift-check.py
