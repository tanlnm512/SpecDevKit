name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Intent skill suite
        run: skills/spec-intent/tests/run.sh
      - name: Shape skill suite
        run: skills/spec-shape/tests/run.sh
      - name: Execute skill suite
        run: skills/spec-execute/tests/run.sh
      - name: Review skill suite
        run: skills/spec-code-review/tests/run.sh
      - name: Brainstorm skill suite
        run: skills/spec-brainstorming/tests/run.sh
      - name: Tooling suite
        run: tools/tests/run.sh
      - name: Compile Python sources
        run: python3 -m compileall -q skills tools
      - name: Shell syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n
      - name: Generated-artifact drift
        run: python3 tools/drift-check.py
